name: Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: bauernhof/package-lock.json
      - run: npm ci && npm run build
        working-directory: bauernhof
      - run: cp bauernhof/dist/index.html bauernhof/dist/404.html || true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: bauernhof/dist
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.d.outputs.page_url }}
    steps:
      - id: d
        uses: actions/deploy-pages@v4
